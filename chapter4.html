study of living organisms of microscopic size, including bacteria, fungi, algae, protozoa and viruses."],["Which scientist is associated with the heat-treatment method now called pasteurisation?",["Robert Koch","Louis Pasteur","Alexander Fleming","Antonie van Leeuwenhoek"],1,"The handbook identifies Louis Pasteur with the heat-treatment method called pasteurisation."],["How do bacteria normally multiply?",["By binary fission","By evaporation","By crystallization","By homogenization"],0,"Bacteria normally multiply by binary fission, meaning splitting in two."],["According to Gram staining, what colour are Gram-positive bacteria in the handbook?",["Red","Blue","Green","Yellow"],1,"The handbook states Gram negatives are red and Gram positives are blue."],["What are the three main characteristic bacterial shapes?",["Spherical, rod and spiral","Flat, cubic and triangular","Round, square and filament only","Cocci, mould and yeast"],0,"The three main characteristic shapes are spherical, rod and spiral."],["Which statement about moulds is correct?",["They are normally strictly aerobic","They require no oxygen","They only grow above 60 °C","They cannot grow in acidic media"],0,"The handbook describes moulds as strictly aerobic organisms, with a few exceptions."],["What is the optimum growth temperature for most moulds?",["0–4 °C","10–15 °C","20–30 °C","60–70 °C"],2,"The optimum growth temperature for most moulds is stated as 20–30 °C."],["What are bacteriophages?",["Milk proteins","Viruses that are bacterial parasites","Heat-resistant mould spores","Lactic acid molecules"],1,"Bacteriophages are viruses and bacterial parasites; they replicate within bacterial cells."],["Why can bacteriophages be a serious problem in fermented dairy production?",["They increase milk fat","They can attack bacteria needed for fermentation","They make milk Newtonian","They remove lactose"],1,"Phages can infect starter bacteria and cause a starter culture to collapse."],["What is a typical milk pasteurisation combination stated in the chapter?",["45 °C for 30 minutes","65 °C for 2 seconds","72 °C for 15–20 seconds","100 °C for 1 hour"],2,"The chapter gives 72 °C for 15–20 seconds as a typical combination and stresses preventing recontamination."]];let i=0,s=0,checked=false;const E=x=>document.getElementById(x);function render(){checked=false;E('n').textContent='Question '+(i+1)+' of '+X.length;E('bar').style.width=(i/X.length*100)+'%';E('q').textContent=X[i][0];E('opts').innerHTML='';E('fb').innerHTML='';X[i][1].forEach((o,j)=>{let l=document.createElement('label');l.className='o';l.innerHTML='<input type="radio" name="a" value="'+j+'"> '+o;l.querySelector('input').onchange=()=>E('next').disabled=false;E('opts').append(l)});E('next').disabled=true;E('next').textContent='Check answer'}E('next').onclick=()=>{if(!checked){checked=true;let v=+document.querySelector('input[name=a]:checked').value,ok=v===X[i][2];if(ok)s++;E('fb').className='fb '+(ok?'ok':'no');E('fb').textContent=(ok?'Correct. ':'Not quite. ')+X[i][3];document.querySelectorAll('input[name=a]').forEach(x=>x.disabled=true);E('next').textContent=i===X.length-1?'See result':'Next question';E('bar').style.width=((i+1)/X.length*100)+'%'}else if(++i<X.length)render();else{E('quiz').classList.add('hide');E('res').classList.remove('hide');E('score').textContent=s+'/'+X.length;E('pct').textContent=Math.round(s/X.length*100)+'% correct'}};function reset(){i=0;s=0;E('res').classList.add('hide');E('quiz').classList.remove('hide');render()}render();</script></body></html>
