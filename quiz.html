<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJiGO Dairy Training</title><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#111827}.w{max-width:820px;margin:auto;padding:28px 16px}.c{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px}a{color:#111827}.m{color:#6b7280}.p{height:9px;background:#e5e7eb;border-radius:9px;margin:18px 0}.b{height:100%;background:#111827;border-radius:9px}.q{font-size:20px;font-weight:bold;margin:16px 0}.o{display:block;border:1px solid #d1d5db;border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}.fb{padding:13px;border-radius:10px;margin-top:14px}.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}button{padding:11px 16px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.pri{background:#111827;color:#fff;float:right}.sec{background:#e5e7eb}.hide{display:none}.score{text-align:center;font-size:50px;font-weight:bold}</style></head><body><div class="w"><div class="m"><a href="./">← All chapters</a></div><h1 id="title">Practice quiz</h1><div class="m">Tetra Pak Dairy Processing Handbook · PROJiGO practice</div><div id="quiz" class="c" style="margin-top:18px"><div id="n" class="m"></div><div class="p"><div id="bar" class="b"></div></div><div id="q" class="q"></div><div id="opts"></div><div id="fb"></div><div style="margin-top:18px;overflow:auto"><button class="sec" onclick="reset()">Restart</button><button id="next" class="pri" disabled>Check answer</button></div></div><div id="res" class="c hide" style="margin-top:18px;text-align:center"><div class="m">Practice complete</div><div id="score" class="score"></div><p id="pct"></p><button onclick="reset()">Practice again</button></div></div><script src="data.js"></script><script>
const ch=new URLSearchParams(location.search).get('chapter'),D=window.QUIZ_DATA[ch];if(!D){document.body.innerHTML='<div class="w"><h1>Quiz not found</h1><a href="./">Back to chapters</a></div>';throw 0}document.title='Chapter '+ch+' - '+D.title;document.getElementById('title').textContent='Chapter '+ch+' - '+D.title;const X=D.q;let i=0,s=0,checked=false;const E=x=>document.getElementById(x);function render(){checked=false;E('n').textContent='Question '+(i+1)+' of '+X.length;E('bar').style.width=(i/X.length*100)+'%';E('q').textContent=X[i][0];E('opts').innerHTML='';E('fb').innerHTML='';X[i].slice(1,5).forEach((o,j)=>{let l=document.createElement('label');l.className='o';l.innerHTML='<input type="radio" name="a" value="'+j+'"> '+o;l.querySelector('input').onchange=()=>E('next').disabled=false;E('opts').append(l)});E('next').disabled=true;E('next').textContent='Check answer'}E('next').onclick=()=>{if(!checked){checked=true;let v=+document.querySelector('input[name=a]:checked').value,ok=v===0;if(ok)s++;E('fb').className='fb '+(ok?'ok':'no');E('fb').textContent=(ok?'Correct. ':'Not quite. Correct answer: '+X[i][1]+'. ')+X[i][5];document.querySelectorAll('input[name=a]').forEach(x=>x.disabled=true);E('next').textContent=i===X.length-1?'See result':'Next question';E('bar').style.width=((i+1)/X.length*100)+'%'}else if(++i<X.length)render();else{E('quiz').classList.add('hide');E('res').classList.remove('hide');E('score').textContent=s+'/'+X.length;E('pct').textContent=Math.round(s/X.length*100)+'% correct'}};function reset(){i=0;s=0;E('res').classList.add('hide');E('quiz').classList.remove('hide');render()}render();
</script></body></html>
