<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJiGO - Chapter 5 - Collection and Reception of Milk</title><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#111827}.w{max-width:820px;margin:auto;padding:28px 16px}.c{background:white;border:1px solid #ddd;border-radius:16px;padding:24px}h1{margin:0 0 5px}.m{color:#6b7280}.p{height:9px;background:#e5e7eb;border-radius:9px;margin:18px 0}.b{height:100%;background:#111827;border-radius:9px}.q{font-size:20px;font-weight:bold;margin:16px 0}.o{display:block;border:1px solid #d1d5db;border-radius:10px;padding:12px;margin:9px 0}.fb{padding:13px;border-radius:10px;margin-top:14px}.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}button{padding:11px 16px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.pri{background:#111827;color:white;float:right}.sec{background:#e5e7eb}.hide{display:none}.score{text-align:center;font-size:50px;font-weight:bold}</style></head><body><div class="w"><div class="m"><a href="index.html">PROJiGO Training</a></div><h1>Chapter 5 - Collection and Reception of Milk</h1><div class="m">Tetra Pak Dairy Processing Handbook · Practice quiz</div><div id="quiz" class="c" style="margin-top:18px"><div id="n" class="m"></div><div class="p"><div id="bar" class="b"></div></div><div id="q" class="q"></div><div id="opts"></div><div id="fb"></div><div style="margin-top:18px;overflow:auto"><button class="sec" onclick="reset()">Restart</button><button id="next" class="pri" disabled>Check answer</button></div></div><div id="res" class="c hide" style="margin-top:18px;text-align:center"><div class="m">Practice complete</div><div id="score" class="score"></div><p id="pct"></p><button onclick="reset()">Practice again</button></div></div><script>const X=[["To what temperature should milk be chilled immediately after milking?",["+4 °C","+12 °C","+20 °C","0 °C"],0,"The handbook says milk should be chilled to +4 °C immediately after milking and kept at this temperature to the dairy."],["What happens if the cold chain is broken during transportation?",["Microorganisms can start multiplying","Milk becomes sterile","Protein content increases","All enzymes are destroyed"],0,"A break in the cold chain allows microorganisms to multiply and form metabolic products and enzymes."],["What is an example requirement for a farm bulk cooling tank?",["Cool all milk to +4 °C within two hours","Heat milk to 72 °C immediately","Keep milk at 20 °C","Remove all milk fat"],0,"The chapter gives chilling all milk in the tank to +4 °C within two hours after milking as an example stipulation."],["Why should tanker compartments be well filled?",["To prevent sloshing and treat milk gently","To increase aeration","To heat the milk","To increase bacterial growth"],0,"Well-filled tanks help prevent milk from sloshing during transport."],["Why is an air eliminator used before volumetric measurement?",["To improve measuring accuracy","To pasteurize the milk","To increase fat content","To add oxygen"],0,"A flowmeter registers air as well as milk, so removing air improves volume measurement accuracy."],["Which is listed as a common milk-quality test?",["Freezing point","Paint viscosity","Pipe wall thickness","Motor current"],0,"The handbook lists freezing point among common tests on milk supplies."],["Why is the freezing point of milk checked?",["To detect possible dilution with water","To measure bacterial shape","To determine tank pressure","To calculate pump speed"],0,"Normal milk freezes at about -0.54 to -0.59 °C; added water raises the freezing point."],["What is the first thing done at milk reception according to the chapter?",["Determine the quantity of milk","Homogenize the milk","Ferment the milk","Dry the milk"],0,"At reception, the quantity is determined and recorded in the dairy's intake system."],["Bulk-collected milk can be measured in which two basic ways?",["By volume or by weight","By colour or taste","By pH or temperature only","By pressure or viscosity"],0,"The chapter describes intake measurement by volume or by weight."],["What is normally done if incoming milk has warmed slightly above +4 °C during transport?",["Cool it below +4 °C before silo storage","Warm it to 30 °C","Add water","Leave it at ambient temperature"],0,"Incoming milk is usually cooled to below +4 °C in a plate heat exchanger before silo storage."]];let i=0,s=0,checked=false;const E=x=>document.getElementById(x);function render(){checked=false;E('n').textContent='Question '+(i+1)+' of '+X.length;E('bar').style.width=(i/X.length*100)+'%';E('q').textContent=X[i][0];E('opts').innerHTML='';E('fb').innerHTML='';X[i][1].forEach((o,j)=>{let l=document.createElement('label');l.className='o';l.innerHTML='<input type="radio" name="a" value="'+j+'"> '+o;l.querySelector('input').onchange=()=>E('next').disabled=false;E('opts').append(l)});E('next').disabled=true;E('next').textContent='Check answer'}E('next').onclick=()=>{if(!checked){checked=true;let v=+document.querySelector('input[name=a]:checked').value,ok=v===X[i][2];if(ok)s++;E('fb').className='fb '+(ok?'ok':'no');E('fb').textContent=(ok?'Correct. ':'Not quite. ')+X[i][3];document.querySelectorAll('input[name=a]').forEach(x=>x.disabled=true);E('next').textContent=i===X.length-1?'See result':'Next question';E('bar').style.width=((i+1)/X.length*100)+'%'}else if(++i<X.length)render();else{E('quiz').classList.add('hide');E('res').classList.remove('hide');E('score').textContent=s+'/'+X.length;E('pct').textContent=Math.round(s/X.length*100)+'% correct'}};function reset(){i=0;s=0;E('res').classList.add('hide');E('quiz').classList.remove('hide');render()}render();</script></body></html>
