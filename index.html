<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJiGO Training - Chapter 3 Rheology</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db;--accent:#111827;--ok:#166534;--bad:#991b1b;--okbg:#dcfce7;--badbg:#fee2e2}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:820px;margin:auto;padding:28px 16px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{font-size:28px;margin:0 0 6px}.sub,.small{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:16px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:8px 0 18px}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}.qnum{font-size:13px;color:var(--muted);margin-bottom:8px}.question{font-size:20px;font-weight:700;line-height:1.35;margin-bottom:18px}.option{display:block;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer;background:#fff}.option:hover{background:#f9fafb}.option input{margin-right:10px}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e5e7eb;color:#111827}button:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:18px;padding:14px;border-radius:12px;display:none}.feedback.ok{display:block;background:var(--okbg);color:var(--ok)}.feedback.bad{display:block;background:var(--badbg);color:var(--bad)}.result{text-align:center}.score{font-size:56px;font-weight:800;margin:10px 0}.pass{color:var(--ok)}.fail{color:var(--bad)}.summary{margin-top:22px;text-align:left}.summary-item{border-top:1px solid var(--border);padding:14px 0}.hidden{display:none}@media(max-width:600px){h1{font-size:24px}.card{padding:18px}.question{font-size:18px}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Chapter 3 - Rheology</h1><div class="sub">Tetra Pak Dairy Processing Handbook · PROJiGO practice quiz</div></div><div class="sub">Practice mode</div></div>
<div id="quiz" class="card"><div class="qnum" id="qnum"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="options"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="restartBtn" class="secondary">Restart</button><button id="nextBtn" class="primary" disabled>Check answer</button></div></div>
<div id="result" class="card result hidden"><div class="small">Practice complete</div><div class="score" id="score"></div><div id="passText"></div><div class="summary" id="summary"></div><div style="margin-top:20px"><button id="againBtn" class="primary">Practice again</button></div></div>
</div><script>
const questions=[
{type:"single",q:"According to Chapter 3, what is rheology?",options:["The science of heat transfer through food products","The science of deformation and flow of matter","The study of microorganisms in liquid foods","The measurement of milk composition"],correct:[1],explanation:"Rheology is defined as the science of deformation and flow of matter."},
{type:"single",q:"Which two properties are used in the handbook to describe consistency rheologically?",options:["Density and temperature","Viscosity and elasticity","Pressure and flow rate","Fat content and protein content"],correct:[1],explanation:"The handbook describes consistency in terms of viscosity and elasticity."},
{type:"single",q:"At a specified temperature, how does the viscosity of a Newtonian fluid respond to a change in shear rate?",options:["It remains constant","It always increases","It always decreases","It becomes zero above a critical shear rate"],correct:[0],explanation:"For a Newtonian fluid, viscosity is independent of applied shear rate at a given temperature."},
{type:"single",q:"Which dairy products can, for practical purposes, be treated as Newtonian fluids?",options:["Whole milk and skim milk","Yoghurt and mayonnaise","Quark and tomato paste","Cream and yoghurt"],correct:[0],explanation:"Whole milk and skim milk may practically be characterized as Newtonian."},
{type:"single",q:"A yoghurt becomes easier to pump as shear rate increases. What type of behaviour is this?",options:["Shear-thickening","Shear-thinning","Purely elastic","Newtonian"],correct:[1],explanation:"Shear-thinning means apparent viscosity decreases as shear rate increases."},
{type:"multi",q:"Which three are listed as typical shear-thinning products or systems?",options:["Yoghurt","Cream","Juice concentrates","Concentrated starch suspension"],correct:[0,1,2],explanation:"Yoghurt, cream and juice concentrates are typical shear-thinning systems. Concentrated starch suspension is a shear-thickening example."},
{type:"single",q:"What happens to viscosity in a shear-thickening fluid when shear rate increases?",options:["It decreases","It remains constant","It increases","It first becomes zero"],correct:[2],explanation:"A shear-thickening fluid becomes more viscous as shear rate increases."},
{type:"single",q:"What distinguishes a plastic fluid from a fluid that simply has a high viscosity?",options:["It must be heated before it flows","It has a yield stress that must be exceeded before significant flow begins","Its viscosity is always constant","It cannot store deformation energy"],correct:[1],explanation:"Plastic fluids exhibit yield stress; the stress must be exceeded before significant flow begins."},
{type:"single",q:"A yoghurt's viscosity continues to decrease with time while it is held at a constant shear rate. What does this indicate?",options:["Thixotropic behaviour","Newtonian behaviour","Shear-thickening behaviour only","Pure elastic behaviour"],correct:[0],explanation:"Thixotropic fluids decrease in viscosity with time at a constant shear rate."},
{type:"single",q:"Why should viscosity data for process design be measured at representative shear rates and temperatures?",options:["Because every dairy product becomes Newtonian at high shear","Because non-Newtonian behaviour and viscosity depend on actual process conditions","Because viscosity depends only on product colour","Because temperature has essentially no effect on viscosity"],correct:[1],explanation:"Measurements should represent the shear rates and temperatures of the actual process."}
];
let current=0,score=0,answers=[],checked=false;
const quiz=document.getElementById("quiz"),result=document.getElementById("result"),qnum=document.getElementById("qnum"),bar=document.getElementById("bar"),question=document.getElementById("question"),options=document.getElementById("options"),feedback=document.getElementById("feedback"),nextBtn=document.getElementById("nextBtn");
function render(){checked=false;feedback.className="feedback";feedback.textContent="";nextBtn.textContent="Check answer";nextBtn.disabled=true;const item=questions[current];qnum.textContent=`Question ${current+1} of ${questions.length}`;bar.style.width=`${current/questions.length*100}%`;question.textContent=item.q;options.innerHTML="";item.options.forEach((opt,i)=>{const lab=document.createElement("label");lab.className="option";const inp=document.createElement("input");inp.type=item.type==="multi"?"checkbox":"radio";inp.name="answer";inp.value=i;inp.onchange=()=>nextBtn.disabled=options.querySelectorAll("input:checked").length===0;lab.append(inp,document.createTextNode(opt));options.append(lab)})}
function check(){const item=questions[current],selected=[...options.querySelectorAll("input:checked")].map(x=>+x.value).sort(),correct=[...item.correct].sort(),ok=selected.length===correct.length&&selected.every((v,i)=>v===correct[i]);if(!checked){checked=true;if(ok)score++;answers.push({selected,ok});feedback.className="feedback "+(ok?"ok":"bad");feedback.textContent=(ok?"Correct. ":"Not quite. ")+item.explanation;options.querySelectorAll("input").forEach(x=>x.disabled=true);nextBtn.textContent=current===questions.length-1?"See result":"Next question";bar.style.width=`${(current+1)/questions.length*100}%`}else if(current<questions.length-1){current++;render()}else showResult()}
function showResult(){quiz.classList.add("hidden");result.classList.remove("hidden");const pct=Math.round(score/questions.length*100),s=document.getElementById("score");s.textContent=`${score}/${questions.length}`;s.className="score "+(pct>=80?"pass":"fail");document.getElementById("passText").textContent=`${pct}% correct`;const summary=document.getElementById("summary");summary.innerHTML="";questions.forEach((q,i)=>{const d=document.createElement("div");d.className="summary-item";const picked=answers[i].selected.map(ix=>q.options[ix]).join(", "),right=q.correct.map(ix=>q.options[ix]).join(", ");d.innerHTML=`<strong>${i+1}. ${q.q}</strong><div class="small" style="margin-top:6px">Your answer: ${picked||"No answer"}</div><div class="small">Correct answer: ${right}</div>`;summary.append(d)})}
function reset(){current=0;score=0;answers=[];checked=false;result.classList.add("hidden");quiz.classList.remove("hidden");render()}
nextBtn.onclick=check;document.getElementById("restartBtn").onclick=reset;document.getElementById("againBtn").onclick=reset;render();
</script></body></html>
